# =============================================================================
#  Embarcacao Pirata - tudo em containers
#
#  Subir:      docker compose up -d
#  Ver o log:  docker compose logs -f app
#  Parar:      docker compose down          (os dados ficam nos volumes)
# =============================================================================

services:

  # ---------------------------------------------------------------------
  # A inteligencia artificial local
  # ---------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: pirata-ollama
    restart: unless-stopped
    volumes:
      - modelos-ollama:/root/.ollama
    environment:
      # Mantem o modelo carregado: sem isso a primeira resposta apos uma
      # pausa demora dezenas de segundos em CPU.
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    # Nao expoe porta para a internet: so o container do site conversa com ele.
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 8g

  # ---------------------------------------------------------------------
  # O site, a API e o robo do WhatsApp
  # ---------------------------------------------------------------------
  app:
    build: .
    container_name: pirata-app
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
      DATA_DIR: /dados
      WA_AUTH_DIR: /sessao-whatsapp
    volumes:
      - dados:/dados
      - sessao-whatsapp:/sessao-whatsapp
    ports:
      # Só o Caddy precisa alcançar a porta. Em 127.0.0.1 ela não fica exposta
      # na internet. Se voce NAO for usar o Caddy, troque por "80:3000".
      - "127.0.0.1:3000:3000"
    depends_on:
      - ollama
    # O QR Code do WhatsApp aparece no log deste container:
    #   docker compose logs -f app
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------
  # HTTPS automatico (certificado gratuito, renovado sozinho)
  # Só sobe se voce pedir:  docker compose --profile https up -d
  # ---------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: pirata-caddy
    restart: unless-stopped
    profiles: ["https"]
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  dados:
  sessao-whatsapp:
  modelos-ollama:
  caddy-dados:
  caddy-config:
